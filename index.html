<title>Cẩm nang SunMoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#FFFFFF; --paper-2:#F6F4EF; --paper-3:#ECE8DF;
  --ink:#2A2521; --ink-2:#5E554D; --ink-3:#8A8078;
  --line:rgba(42,37,33,.13); --line-2:rgba(42,37,33,.28);
  --sun:#C9951F; --sun-wash:#FBF1D6;
  --moon:#5B7186; --moon-wash:#E6ECF1;
  --verm:#C4392A; --verm-wash:#FBE9E5; --verm-ink:#FFF7F2;
  --ok:#3F7D5A; --ok-wash:#E4F1E8;
  --part:var(--ink); --part-wash:var(--paper-2);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --sc:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1F1B18; --paper-2:#28231F; --paper-3:#332D27;
    --ink:#F1E8DA; --ink-2:#BFB3A4; --ink-3:#8E8478;
    --line:rgba(241,232,218,.13); --line-2:rgba(241,232,218,.3);
    --sun:#D9AB45; --sun-wash:#3A3020;
    --moon:#A7B9CA; --moon-wash:#2A3138;
    --verm:#E0624F; --verm-wash:#3A2420; --verm-ink:#FFF7F2;
    --ok:#7CC49A; --ok-wash:#1F3328;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1F1B18; --paper-2:#28231F; --paper-3:#332D27;
  --ink:#F1E8DA; --ink-2:#BFB3A4; --ink-3:#8E8478;
  --line:rgba(241,232,218,.13); --line-2:rgba(241,232,218,.3);
  --sun:#D9AB45; --sun-wash:#3A3020;
  --moon:#A7B9CA; --moon-wash:#2A3138;
  --verm:#E0624F; --verm-wash:#3A2420; --verm-ink:#FFF7F2;
  --ok:#7CC49A; --ok-wash:#1F3328;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.sc{font-family:var(--sc);font-weight:400}
:focus-visible{outline:2px solid var(--verm);outline-offset:3px;border-radius:3px}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;overflow-x:hidden;padding:2rem 1.25rem;background:
  radial-gradient(80% 60% at 15% 10%,var(--sun-wash),transparent 60%),
  radial-gradient(70% 60% at 90% 95%,var(--moon-wash),transparent 60%),var(--paper)}
.gate-card{width:min(26rem,100%);min-width:0;justify-self:center;display:grid;gap:1.1rem;text-align:left}
.gate-logo{width:84px;height:auto}
.gate h1{font-family:var(--serif);font-weight:400;font-size:2.2rem;line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
.gate p{margin:0;color:var(--ink-2)}
.gate form{display:grid;gap:.6rem;margin-top:.4rem}
.gate label{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.gate-row{display:flex;gap:.5rem}
.gate input{flex:1;min-width:0;width:100%;padding:.85rem 1rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font-size:1.05rem;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.3rem;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--verm);border-color:var(--verm);color:var(--verm-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gate input:focus,.gate input:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun-wash)}
@media (max-width:480px){.gate-row{flex-direction:column}.gate .btn{width:100%;padding:.95rem 1.3rem}.gate h1{font-size:1.9rem}}
.gate-msg{min-height:1.5em;font-size:.92rem;color:var(--verm)}
.gate-foot{font-size:.82rem;color:var(--ink-3)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:1rem;padding:.7rem clamp(1rem,3vw,2rem)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;min-width:0}
.brand img{width:34px;height:auto}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.12rem;white-space:nowrap}
.brand span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.prog{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:999px;font-size:.74rem;font-weight:600;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.done{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
.chip.lock{color:var(--ink-3);border-style:dashed}
.menu-btn{display:none;border:1px solid var(--line-2);background:none;border-radius:999px;padding:.35rem .85rem;font-size:.78rem;font-weight:600;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:17.5rem minmax(0,1fr);gap:clamp(2rem,4vw,4rem);width:min(1240px,100%);margin-inline:auto;padding:0 clamp(1rem,3vw,2rem)}
.rail{position:sticky;top:4.2rem;align-self:start;max-height:calc(100vh - 4.2rem);overflow:auto;padding:2rem 0 3rem;font-size:.9rem}
.rail h4{margin:1.4rem 0 .4rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--part);display:flex;align-items:center;gap:.45rem}
.rail h4:first-child{margin-top:0}
.rail h4 .sc{font-size:.95rem;letter-spacing:0}
.rail ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.rail li a{display:grid;grid-template-columns:2.6rem 1fr;gap:.3rem;padding:.28rem .6rem .28rem .8rem;margin-left:-1px;border-left:2px solid transparent;text-decoration:none;color:var(--ink-2);line-height:1.35}
.rail li a .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.8rem;padding-top:.1rem}
.rail li a:hover{color:var(--ink)}
.rail li a.on{color:var(--ink);border-left-color:var(--part);font-weight:600}
.rail li.locked a{color:var(--ink-3);pointer-events:none}
.rail .lockline{font-size:.8rem;color:var(--ink-3);padding:.4rem .8rem;border-left:1px dashed var(--line-2);margin-left:-1px}
[data-p="1"]{--part:var(--sun);--part-wash:var(--sun-wash)}
[data-p="A"]{--part:var(--verm);--part-wash:var(--verm-wash)}
[data-p="B"]{--part:var(--moon);--part-wash:var(--moon-wash)}
[data-p="P"]{--part:var(--ink-2);--part-wash:var(--paper-2)}

/* ---------- document ---------- */
main{padding:2.5rem 0 6rem;max-width:46rem}
main p{margin:0 0 1rem}
main ul,main ol{margin:0 0 1rem;padding-left:1.2rem}
main li{margin:.28rem 0}
main li::marker{color:var(--part)}
main b{font-weight:600}
section{padding:2.2rem 0;border-top:1px solid var(--line)}
.part-head+section{border-top:0}
section>h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.45rem,2.4vw,1.8rem);line-height:1.2;margin:0 0 1rem;letter-spacing:-.005em;text-wrap:balance;display:flex;gap:.8rem;align-items:baseline}
section>h2 .no{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--part);font-variant-numeric:tabular-nums;flex:none;min-width:2.6rem}
h3{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:1.5rem 0 .55rem}
.intro{border-top:0;padding-top:.5rem}
.kicker{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:.6rem}
.kicker .sc{color:var(--verm);font-size:1rem;letter-spacing:.2em}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.3rem,5vw,3.5rem);line-height:1.04;letter-spacing:-.015em;margin:.6rem 0 1.2rem;text-wrap:balance}
.lede{font-family:var(--serif);font-size:clamp(1.15rem,1.8vw,1.35rem);line-height:1.5;color:var(--ink)}
.lede b{font-weight:600}
.path{counter-reset:p;list-style:none;padding:0!important;display:grid;gap:.1rem;margin:1.4rem 0!important;border-top:1px solid var(--line)}
.path li{counter-increment:p;position:relative;padding:.7rem 0 .7rem 2.2rem;border-bottom:1px solid var(--line);margin:0}
.path li::before{content:counter(p);position:absolute;left:0;top:.62rem;font-family:var(--serif);font-size:1.3rem;color:var(--verm);line-height:1.3}
.motto{font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.5;padding-left:1rem;border-left:2px solid var(--verm);color:var(--ink)}

.part-head{position:relative;overflow:hidden;margin:3rem 0 0;padding:2.4rem 1.6rem 2rem;border-radius:var(--r);background:var(--part-wash);isolation:isolate}
.part-head::after{content:attr(data-glyph);position:absolute;right:-.06em;bottom:-.3em;z-index:-1;font-family:var(--sc);font-size:clamp(8rem,20vw,12rem);line-height:1;color:var(--part);opacity:.12;pointer-events:none}
.part-no{margin:0 0 .3rem!important;font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--part)}
.part-no .sc{display:none}
.part-title{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,2.8rem);line-height:1.05;margin:0 0 .6rem;letter-spacing:-.01em;text-wrap:balance}
.part-head p:last-child{margin:0;color:var(--ink-2);max-width:34rem}

.tbl{overflow-x:auto;margin:0 0 1.2rem;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:.65rem .85rem;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-2);background:var(--paper-2)}
td:first-child{font-weight:500}
td[rowspan]{background:var(--paper-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{display:block;font-size:.8rem;color:var(--ink-3);font-weight:400}
.note{font-size:.9rem;color:var(--ink-2)}
.py{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88em;background:var(--paper-2);padding:.05em .35em;border-radius:3px}
td .sc,li .sc,p .sc{font-size:1.05em}

.quote{margin:0 0 1.4rem;padding:1.3rem 1.4rem;background:var(--sun-wash);border-radius:var(--r)}
.quote p{font-family:var(--serif);font-size:1.3rem;line-height:1.4;margin:0 0 .4rem}
.quote cite{font-style:normal;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 1.4rem}
.values>div{background:var(--paper);padding:1rem 1.1rem;display:grid;grid-template-columns:2.4rem 1fr;column-gap:.6rem}
.values .sc{grid-row:span 2;font-size:1.9rem;line-height:1;color:var(--part)}
.values p{margin:0;font-size:.9rem;color:var(--ink-2)}
.steps{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.steps li{margin:0;display:grid;gap:.15rem;padding:1rem;border:1px solid var(--line);border-radius:var(--r);position:relative}
.steps li .sc{font-size:1.5rem;color:var(--part);line-height:1.2}
.steps li span:last-child{font-size:.86rem;color:var(--ink-2);line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem}
.two h3:first-child,.three h3:first-child{margin-top:0}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
.checklist>div{padding:1rem 1.1rem;border:1px solid var(--line);border-radius:var(--r)}
.checklist ul{list-style:none;padding:0;margin:0}
.checklist li{padding-left:1.5rem;position:relative;font-size:.92rem}
.checklist li::before{content:"";position:absolute;left:0;top:.35em;width:.85em;height:.85em;border:1.5px solid var(--line-2);border-radius:3px}
ul.checks{list-style:none;padding:0}
ul.checks li{padding:.55rem 0 .55rem 1.8rem;position:relative;border-bottom:1px solid var(--line);margin:0}
ul.checks li:last-child{border-bottom:0}
ul.checks li::before{content:"";position:absolute;left:.1rem;top:.95em;width:.9em;height:.9em;border:1.5px solid var(--part);border-radius:3px}

.msg{margin:0 0 1rem;padding:1rem 1.2rem;background:var(--paper-2);border-radius:var(--r);border-left:3px solid var(--part)}
.msg p{margin:0}
.msg-label{font-size:.7rem!important;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-bottom:.35rem!important}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin:0 0 1.2rem}
.compare>div{padding:.9rem 1.1rem;border-radius:var(--r)}
.compare p{margin:0}
.compare .bad{background:var(--verm-wash)}
.compare .bad .msg-label{color:var(--verm)}
.compare .bad p:last-child{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--verm) 55%,transparent);text-decoration-thickness:1px}
.compare .good{background:var(--ok-wash)}
.compare .good .msg-label{color:var(--ok)}

.danger ol.redline{list-style:none;padding:0;margin:0;counter-reset:r;border-top:1px solid var(--line)}
.redline li{counter-increment:r;position:relative;padding:.6rem 0 .6rem 2.4rem;border-bottom:1px solid var(--line);margin:0}
.redline li::before{content:counter(r,decimal-leading-zero);position:absolute;left:0;top:.8rem;font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;color:var(--ink-3);line-height:1.3}
.redline li.red{font-weight:500}
.redline li.red::after{content:"●";position:absolute;left:1.45rem;top:.72rem;color:var(--verm);font-size:.75rem;line-height:1.3}
.mark{color:var(--verm)}
.words{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 1.2rem}
.words span{padding:.3rem .75rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--verm) 40%,transparent);color:var(--verm);font-size:.9rem;text-decoration:line-through;text-decoration-thickness:1px}
.games{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;counter-reset:g}
.games li{counter-increment:g;margin:0;padding:.75rem .9rem;border:1px solid var(--line);border-radius:var(--r);display:grid}
.games li b::before{content:counter(g) ". ";color:var(--part);font-variant-numeric:tabular-nums}
.games li span{font-size:.82rem;color:var(--ink-3)}
.criteria{columns:2;column-gap:2rem}
.criteria li{break-inside:avoid}
details.case{border:1px solid var(--line);border-radius:var(--r);margin:0 0 .6rem;background:var(--paper)}
details.case summary{cursor:pointer;padding:.85rem 2.6rem .85rem 1rem;list-style:none;position:relative;line-height:1.5}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"+";position:absolute;right:1rem;top:.75rem;font-size:1.2rem;color:var(--part);font-weight:500}
details.case[open] summary::before{content:"–"}
details.case[open] summary{border-bottom:1px dashed var(--line-2)}
details.case p{margin:0;padding:.85rem 1rem 1rem;background:var(--part-wash);border-radius:0 0 var(--r) var(--r)}
.btn-link{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;text-decoration:none;padding:.65rem 1.1rem;border-radius:999px;border:1px solid var(--part);color:var(--part)}
.btn-link:hover{background:var(--part);color:var(--paper)}
.btn-link::after{content:"↗"}

/* ---------- lock, commit, quiz ---------- */
.gatebox{border-top:1px solid var(--line)}
.lockpanel{margin:3rem 0 0;padding:2rem 1.6rem;border:1px dashed var(--line-2);border-radius:var(--r);display:grid;gap:.6rem;background:var(--paper-2)}
.lockpanel b{font-family:var(--serif);font-weight:500;font-size:1.4rem}
.lockpanel p{margin:0;color:var(--ink-2)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.3rem 1.4rem;margin:0 0 1.4rem;background:var(--paper)}
.card h3{margin-top:0;color:var(--part)}
.field{display:grid;gap:.35rem;margin:0 0 .9rem}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.field input,.field select{padding:.7rem .85rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper)}
.tick{display:grid;grid-template-columns:1.4rem 1fr;gap:.5rem;padding:.4rem 0;font-size:.95rem;cursor:pointer}
.tick input{width:1.05rem;height:1.05rem;margin-top:.25rem;accent-color:var(--verm)}
.signed{display:flex;gap:.8rem;align-items:center;padding:.9rem 1.1rem;background:var(--ok-wash);color:var(--ok);border-radius:var(--r);font-weight:600;margin:0 0 1.4rem}
.signed span{color:var(--ink-2);font-weight:400}
.quiz-intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem 1rem;align-items:baseline;margin:0 0 1rem}
.quiz-intro p{margin:0;color:var(--ink-2);font-size:.95rem}
fieldset.q{border:1px solid var(--line);border-radius:var(--r);margin:0 0 .8rem;padding:1rem 1.1rem 1.1rem}
fieldset.q legend{padding:0 .3rem;margin-left:-.3rem;font-weight:600;line-height:1.45;float:left;width:100%;margin-bottom:.6rem}
fieldset.q legend .qn{color:var(--part);font-variant-numeric:tabular-nums;margin-right:.35rem}
.opt{display:grid;grid-template-columns:1.4rem 1fr;gap:.5rem;padding:.5rem .7rem;border-radius:var(--r);cursor:pointer;font-size:.96rem;line-height:1.45;clear:both}
.opt:hover{background:var(--paper-2)}
.opt input{margin-top:.25rem;accent-color:var(--part)}
.opt:has(input:checked){background:var(--part-wash)}
fieldset.q.wrong{border-color:var(--verm);background:color-mix(in srgb,var(--verm-wash) 50%,var(--paper))}
fieldset.q.right{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
fieldset.q.miss{border-color:var(--sun)}
.qfb{clear:both;font-size:.86rem;margin:.5rem 0 0;color:var(--verm)}
.qfb a{color:inherit;font-weight:600}
.quiz-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem}
.quiz-actions .hint{font-size:.9rem;color:var(--verm)}
.result{border-radius:var(--r);padding:1.5rem 1.5rem 1.4rem;margin:0 0 1.4rem;display:grid;gap:.4rem}
.result.pass{background:var(--ok-wash)}
.result.fail{background:var(--verm-wash)}
.result .big{font-family:var(--serif);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.result .st{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.result.pass .st{color:var(--ok)} .result.fail .st{color:var(--verm)}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:.6rem 0 0;font-size:.92rem}
.result dt{color:var(--ink-2)} .result dd{margin:0;font-weight:600}
.result .shot{font-size:.88rem;color:var(--ink-2);margin:.4rem 0 0}
.best{font-size:.88rem;color:var(--ink-2)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:3.6rem 0 0 0;max-height:none;background:var(--paper);z-index:15;padding:1.5rem 1.25rem 4rem;transform:translateX(-100%);transition:transform .25s ease;border-right:1px solid var(--line)}
  body.menu-open .rail{transform:none}
  .menu-btn{display:inline-block}
  .prog .chip:not(.key){display:none}
  main{max-width:none}
}
@media (max-width:640px){
  body{font-size:16px}
  .brand span{display:none}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.three,.compare{grid-template-columns:minmax(0,1fr)}
  .games{grid-template-columns:repeat(2,minmax(0,1fr))}
  .values{grid-template-columns:minmax(0,1fr)}
  .criteria{columns:1}
  .part-head{padding:2rem 1.2rem 1.6rem}
}
@media print{.top,.rail,.gate{display:none}.shell{display:block}main{max-width:none}}
</style>

</head>

(function(){
var KEY='sm_cn_v1', SKEY='sm_cn_code';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
var S=load();
var DATA=null;
var $=function(q,r){return (r||document).querySelector(q)}, $$=function(q,r){return Array.prototype.slice.call((r||document).querySelectorAll(q))};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,'')}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

function decrypt(code){
  var E=window.SM_ENC, enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(norm(code)),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},k,b64(E.d))})
    .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}

function boot(){
  if(window.SM_PLAIN){start(window.SM_PLAIN);return}
  var saved=null;try{saved=sessionStorage.getItem(SKEY)}catch(e){}
  if(saved){decrypt(saved).then(start,showGate)}else showGate();
}
function showGate(){
  $('#gate').hidden=false;
  var f=$('#gate-form'),msg=$('#gate-msg'),inp=$('#code');
  inp.focus();
  f.addEventListener('submit',function(e){
    e.preventDefault();msg.textContent='Đang mở…';
    decrypt(inp.value).then(function(d){
      try{sessionStorage.setItem(SKEY,norm(inp.value))}catch(e){}
      $('#gate').hidden=true;start(d);
    },function(){msg.textContent='Mã chưa đúng. Kiểm tra lại hoặc hỏi quản lý để lấy mã.';inp.select()});
  });
}

/* ---------- render ---------- */
var GLYPH={'1':'日月','A':'纪','B':'业','P':'附'};
function start(d){
  DATA=d;
  var doc=$('#doc');doc.innerHTML=d.html;
  $$('.part-head',doc).forEach(function(h){var g=$('.part-no .sc',h);h.setAttribute('data-p',h.getAttribute('data-part'));h.setAttribute('data-glyph',g?g.textContent:'')});
  $$('section[data-part]',doc).forEach(function(s){var p=s.getAttribute('data-part');s.setAttribute('data-p',p==='0'?'A':p)});
  $('#app').hidden=false;
  buildRail();renderCommit();renderQuiz('A');renderQuiz('B');applyLock();progress();spy();
  $('#menu-btn').addEventListener('click',function(){var o=document.body.classList.toggle('menu-open');this.setAttribute('aria-expanded',o)});
  $('#rail').addEventListener('click',function(e){if(e.target.closest('a'))document.body.classList.remove('menu-open')});
  if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t&&!t.hidden)setTimeout(function(){t.scrollIntoView()},50)}
}

function secNo(id){var s=document.getElementById(id);var n=s&&$('h2 .no',s);return n?n.textContent:''}
function buildRail(){
  var groups=[['1','Mục 1 · Tổng quan'],['A','Phần A · Nội quy & kỷ luật'],['B','Phần B · Nghiệp vụ'],['P','Phụ lục']];
  var html='';
  groups.forEach(function(g){
    html+='<div data-p="'+g[0]+'" class="rg" data-g="'+g[0]+'"><h4><span class="sc">'+GLYPH[g[0]]+'</span>'+esc(g[1])+'</h4>';
    if(g[0]==='B')html+='<p class="lockline" id="rail-lock">Mở khi đạt bài kiểm tra Phần A</p>';
    html+='<ul>';
    $$('section[data-part="'+g[0]+'"]').forEach(function(s){
      var h=$('h2',s);if(!h)return;var no=$('.no',h);var t=h.textContent.replace(no?no.textContent:'','').trim();
      html+='<li><a href="#'+s.id+'"><span class="n">'+esc(no?no.textContent:'')+'</span><span>'+esc(t)+'</span></a></li>';
    });
    html+='</ul></div>';
  });
  $('#rail').innerHTML=html;
}

function passed(p){return !!(S[p]&&S[p].passed)}
function applyLock(){
  var open=passed('A');
  $$('[data-part="B"]').forEach(function(el){el.hidden=!open});
  var lp=$('#lockpanel');
  if(!open&&!lp){
    lp=document.createElement('div');lp.id='lockpanel';lp.className='lockpanel';
    lp.innerHTML='<p class="part-no" style="color:var(--moon)">Phần B · Nghiệp vụ</p><b>Phần B đang khóa</b><p>Ký cam kết và đạt bài kiểm tra Phần A (đúng ít nhất '+DATA.quiz.A.pass+'/'+DATA.quiz.A.q.length+' câu) để mở quy trình buổi học, giáo trình, tiết dạy mẫu và cách nhận xét học viên.</p>';
    var ph=document.getElementById('phan-b');ph.parentNode.insertBefore(lp,ph);
  }
  if(open&&lp)lp.remove();
  var rl=$('#rail-lock');if(rl)rl.hidden=open;
  $$('.rg[data-g="B"] li').forEach(function(li){li.classList.toggle('locked',!open);li.hidden=!open});
}

function progress(){
  var c=[];
  c.push(S.sign?'<span class="chip done">✓ Cam kết</span>':'<span class="chip">Chưa ký cam kết</span>');
  c.push(chip('A','Kiểm tra A'));
  c.push(passed('A')?chip('B','Kiểm tra B'):'<span class="chip lock key">Phần B khóa</span>');
  $('#prog').innerHTML=c.join('');
}
function chip(p,label){
  var r=S[p];if(!r||r.best==null)return '<span class="chip key">'+label+'</span>';
  var tot=DATA.quiz[p].q.length;
  return '<span class="chip key'+(r.passed?' done':'')+'">'+(r.passed?'✓ ':'')+label+' '+r.best+'/'+tot+'</span>';
}

/* ---------- commit ---------- */
var PLEDGE=[
 'Tôi đã đọc toàn bộ Mục 1 và Phần A của cẩm nang.',
 'Tôi chấp hành giờ giấc, đồng phục, quy định báo nghỉ và đổi lịch của trung tâm.',
 'Tôi không vi phạm các hành vi nghiêm cấm. Tôi hiểu vi phạm vạch đỏ là trung tâm chấm dứt hợp tác ngay.',
 'Tôi bảo mật thông tin học viên, phụ huynh và học liệu của trung tâm, cả trong và sau thời gian làm việc.',
 'Tôi đặt an toàn của các bé lên trên hết trong mọi giờ học.'
];
function renderCommit(){
  var m=$('.commit-mount');if(!m)return;
  if(S.sign){
    m.innerHTML='<div class="signed">✓ Đã ký cam kết <span>'+esc(S.sign.name)+' · '+esc(S.sign.role)+' · '+esc(S.sign.at)+'</span></div>';
    return;
  }
  var h='<form class="card" id="commit-form"><h3>Bản cam kết</h3>';
  h+='<div class="field"><label for="c-name">Họ và tên</label><input id="c-name" required autocomplete="name"></div>';
  h+='<div class="field"><label for="c-role">Vị trí</label><select id="c-role"><option>Trợ giảng</option><option>Giáo viên</option><option>Giáo viên tập sự</option></select></div>';
  PLEDGE.forEach(function(t,i){h+='<label class="tick"><input type="checkbox" required> <span>'+esc(t)+'</span></label>'});
  h+='<div class="quiz-actions"><button class="btn" type="submit">Ký cam kết</button></div></form>';
  m.innerHTML=h;
  $('#commit-form').addEventListener('submit',function(e){
    e.preventDefault();
    var n=$('#c-name').value.trim();if(!n)return;
    S.sign={name:n,role:$('#c-role').value,at:stamp()};save(S);
    renderCommit();renderQuiz('A');progress();
  });
}
function stamp(){var d=new Date();function p(x){return (x<10?'0':'')+x}return p(d.getHours())+':'+p(d.getMinutes())+' · '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()}

/* ---------- quiz ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function renderQuiz(p,result){
  var m=$('.quiz-mount[data-quiz="'+p+'"]');if(!m)return;
  var Q=DATA.quiz[p],tot=Q.q.length,r=S[p]||{};
  if(p==='A'&&!S.sign){m.innerHTML='<p class="note">Ký bản cam kết ở trên để bắt đầu bài kiểm tra.</p>';return}
  var h='';
  if(result)h+=resultCard(p,result);
  h+='<div class="quiz-intro"><p><b>'+tot+' câu</b> · đạt khi đúng từ <b>'+Q.pass+'</b> câu · làm lại không giới hạn</p>'+(r.best!=null?'<p class="best">Điểm cao nhất: '+r.best+'/'+tot+' · '+(r.passed?'Đã đạt':'Chưa đạt')+'</p>':'')+'</div>';
  h+='<form id="qf-'+p+'">';
  Q.q.forEach(function(q,i){
    var opts=shuffle(q[1].map(function(t,k){return {t:t,k:k}}));
    h+='<fieldset class="q" data-i="'+i+'"><legend><span class="qn">'+(i+1)+'.</span>'+esc(q[0])+'</legend>';
    opts.forEach(function(o){h+='<label class="opt"><input type="radio" name="'+p+'q'+i+'" value="'+o.k+'"><span>'+esc(o.t)+'</span></label>'});
    h+='</fieldset>';
  });
  h+='<div class="quiz-actions"><button class="btn" type="submit">Nộp bài</button><span class="hint" id="hint-'+p+'" role="status"></span></div></form>';
  m.innerHTML=h;
  $('#qf-'+p).addEventListener('submit',function(e){e.preventDefault();grade(p)});
  var more=$('.goto-b',m);if(more)more.addEventListener('click',function(){var b=document.getElementById('phan-b');if(b)b.scrollIntoView()});
}
function grade(p){
  var Q=DATA.quiz[p],f=$('#qf-'+p),miss=[],score=0,wrong=[];
  $$('fieldset.q',f).forEach(function(fs){fs.classList.remove('wrong','right','miss');var old=$('.qfb',fs);if(old)old.remove()});
  Q.q.forEach(function(q,i){var c=$('input[name="'+p+'q'+i+'"]:checked',f);if(!c)miss.push(i)});
  if(miss.length){
    miss.forEach(function(i){$('fieldset[data-i="'+i+'"]',f).classList.add('miss')});
    $('#hint-'+p).textContent='Còn '+miss.length+' câu chưa chọn đáp án (viền vàng).';
    $('fieldset[data-i="'+miss[0]+'"]',f).scrollIntoView({block:'center'});return;
  }
  Q.q.forEach(function(q,i){var c=$('input[name="'+p+'q'+i+'"]:checked',f);if(c.value==='0')score++;else wrong.push(i)});
  var ok=score>=Q.pass,r=S[p]||{};
  r.best=Math.max(r.best||0,score);r.passed=!!(r.passed||ok);r.last=score;r.tries=(r.tries||0)+1;r.at=stamp();
  if(ok&&!r.passAt)r.passAt=r.at;
  S[p]=r;save(S);
  var res={score:score,ok:ok,wrong:wrong,at:r.at,tries:r.tries};
  renderQuiz(p,res);
  var m=$('.quiz-mount[data-quiz="'+p+'"]');
  // mark wrong answers on the fresh form? Keep feedback in result card instead, then scroll to it.
  m.scrollIntoView({block:'start'});
  if(p==='A'){applyLock();renderQuiz('B')}
  progress();
}
function resultCard(p,res){
  var Q=DATA.quiz[p],tot=Q.q.length,nm=S.sign?S.sign.name:'';
  var h='<div class="result '+(res.ok?'pass':'fail')+'">';
  h+='<span class="st">'+(res.ok?'Đạt':'Chưa đạt')+' · Bài kiểm tra Phần '+p+'</span><span class="big">'+res.score+'/'+tot+'</span>';
  h+='<dl><dt>Họ tên</dt><dd>'+esc(nm||'—')+'</dd>'+(S.sign?'<dt>Vị trí</dt><dd>'+esc(S.sign.role)+'</dd>':'')+'<dt>Thời gian</dt><dd>'+esc(res.at)+'</dd><dt>Lần làm</dt><dd>'+res.tries+'</dd></dl>';
  if(res.wrong.length){
    var secs={};res.wrong.forEach(function(i){var id=Q.q[i][2];if(id)secs[id]=1});
    h+='<p class="shot">Sai câu '+res.wrong.map(function(i){return i+1}).join(', ')+'. Đọc lại: '+Object.keys(secs).map(function(id){return '<a href="#'+id+'">mục '+esc(secNo(id))+'</a>'}).join(', ')+', rồi làm lại bên dưới.</p>';
  }
  h+='<p class="shot"><b>Chụp màn hình khung này gửi quản lý qua Zalo.</b></p>';
  if(res.ok&&p==='A')h+='<p style="margin:.5rem 0 0"><button class="btn goto-b" type="button">Sang Phần B · Nghiệp vụ</button></p>';
  h+='</div>';
  return h;
}

/* ---------- scroll spy ---------- */
function spy(){
  if(!('IntersectionObserver' in window))return;
  var links={};$$('#rail a').forEach(function(a){links[a.getAttribute('href').slice(1)]=a});
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('#rail a.on').forEach(function(a){a.classList.remove('on')});var a=links[e.target.id];if(a)a.classList.add('on')}})},{rootMargin:'-20% 0px -70% 0px'});
  $$('section[id]').forEach(function(s){io.observe(s)});
}

boot();
})();
</script>
